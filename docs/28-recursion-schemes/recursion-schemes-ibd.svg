  <defs>
    <marker id="arrowFilled" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 L2.5,5 Z" fill="var(--fp-edge-stroke)"/>
    </marker>
    <marker id="arrowOpen" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.25"/>
    </marker>
    <marker id="arrowHof" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 L2.5,5 Z" fill="var(--fp-hof-edge)"/>
    </marker>
  </defs>
  <text x="819.7" y="18" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="var(--fp-label-fill)">cata :: (F a ⟶ a) ⟶ Fix F ⟶ a</text>
  <text x="819.7" y="35" text-anchor="middle" font-size="11" font-weight="normal" font-family="sans-serif" fill="var(--fp-secondary-text)">inside cata: unFix one layer, fmap cata over its children, then apply alg once</text>
  <g transform="translate(0,44) scale(1)">
    <g transform="translate(82,0)">
      <rect x="0" y="0" width="1459.4" height="160" fill="var(--fp-frame-fill)" stroke="var(--fp-frame-stroke)" stroke-width="1.5"/>
      <g class="diagram-frame-tab tab-block">
        <path d="M0,0 L90.4,0 L90.4,12 L80.4,22 L0,22 Z" fill="var(--fp-frame-tab-fill)" stroke="var(--fp-frame-stroke)" stroke-width="1"/>
        <text x="45.2" y="12" text-anchor="middle" font-size="10" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">«block» cata</text>
      </g>
      <g class="edge">
        <path d="M320.4,108.0 L393.4,108.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="362.9" y="102" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">structure</text>
      </g>
      <g class="edge">
        <path d="M537.4,108.0 L689.4,108.0 Q695.4,108.0 695.4,102.0 L695.4,89.0 L695.4,89.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="618.4" y="102" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">children (internal only)</text>
      </g>
      <g class="edge">
        <path d="M4.0,43.0 L390.9,43.0 Q395.4,43.0 395.4,47.5 L395.4,47.5 Q395.4,52.0 399.9,52.0 L545.4,52.0 Q551.4,52.0 551.4,58.0 L551.4,65.0 Q551.4,71.0 557.4,71.0 L693.4,71.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="199.7" y="37" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">same algebra</text>
      </g>
      <g class="edge">
        <path d="M903.4,80.0 L911.4,80.0 Q917.4,80.0 917.4,74.0 L917.4,67.0 Q917.4,61.0 923.4,61.0 L1015.4,61.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="972.4000000000001" y="55" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">children reduced</text>
      </g>
      <g class="edge">
        <path d="M4.0,43.0 L1015.4,43.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="515.7" y="37" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">algebra</text>
      </g>
      <g class="edge">
        <path d="M1159.4,52.0 L1217.4,52.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="1196.4" y="46" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">result</text>
      </g>
      <g class="edge">
        <path d="M1361.4,52.0 L1443.4,52.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      </g>
      <g class="object-node">
        <title>The structure to reduce: supplied when the returned function is called, not when cata is applied to alg.</title>
        <rect x="69.99999999999999" y="89" width="250.4" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
        <text x="195.2" y="108" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">t : Fix F — supplied when called</text>
      </g>
      <g class="action-node">
        <title>unFix :: Fix F ⟶ F (Fix F) — peel one layer: the node's constructor with its children still unreduced.</title>
        <rect x="413.4" y="86" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="473.4" y="108" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">unfix : unFix</text>
        <g class="pin pin-in">
          <rect x="409.4" y="104" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
        <g class="pin pin-out">
          <rect x="529.4" y="104" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="action-node">
        <title>fmap (cata alg) :: F (Fix F) ⟶ F a — the recursion. cata alg is this very block, applied to every child under F; the shape of the layer is kept.</title>
        <rect x="713.4" y="58" width="186" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="806.4" y="80" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">recurse : fmap (cata alg)</text>
        <g class="pin pin-in">
          <rect x="709.4" y="68.66666666666667" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="719.4" y="72.66666666666667" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">alg</text>
        </g>
        <g class="pin pin-in">
          <rect x="709.4" y="83.33333333333333" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
        <g class="pin pin-out">
          <rect x="895.4" y="76" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="action-node">
        <title>alg :: F a ⟶ a — applied exactly once per node, on a layer whose children are already reduced.</title>
        <rect x="1035.4" y="30" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="1095.4" y="52" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">apply : alg</text>
        <g class="pin pin-in">
          <rect x="1031.4" y="40.666666666666664" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="1041.4" y="44.666666666666664" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">alg</text>
        </g>
        <g class="pin pin-in">
          <rect x="1031.4" y="55.33333333333333" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
        <g class="pin pin-out">
          <rect x="1151.4" y="48" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="action-node">
        <title>Abstract over t again: the whole body becomes the function Fix F ⟶ a that cata returns.</title>
        <rect x="1237.4" y="30" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="1297.4" y="52" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">wrap : λt → a</text>
        <g class="pin pin-in">
          <rect x="1233.4" y="48" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
        <g class="pin pin-out">
          <rect x="1353.4" y="48" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="port port-left">
        <title>alg : F a ⟶ a — the algebra: what to do at one node, given its already-reduced children</title>
        <rect x="-4" y="39" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1.5"/>
        <text x="-7" y="37" font-size="9" font-family="sans-serif" text-anchor="end" fill="var(--fp-port-label)">alg : F a ⟶ a</text>
      </g>
      <g class="port port-right">
        <title>Fix F ⟶ a — the new function; nothing has been reduced yet</title>
        <rect x="1455.4" y="48" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1.5"/>
        <text x="1466.4" y="46" font-size="9" font-family="sans-serif" text-anchor="start" fill="var(--fp-port-label)">eval : Fix F ⟶ a</text>
      </g>
    </g>
  </g>
</svg>
