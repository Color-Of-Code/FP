<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1146 262" width="1146" height="262" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">fold :: (b ⟶ a ⟶ b) ⟶ b ⟶ [a] ⟶ b — inside fold: an empty list returns the accumulator; otherwise f combines it with the head and fold recurses on the tail</title>
