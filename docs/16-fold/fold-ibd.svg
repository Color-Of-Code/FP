        <g class="pin pin-out">
          <rect x="889" y="69" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="action-node">
        <title>Base case: the list is exhausted, the accumulator is the result.</title>
        <rect x="419" y="144" width="138" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="488" y="166" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">stop : return acc</text>
        <g class="pin pin-in">
          <rect x="415" y="154.66666666666666" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="425" y="158.66666666666666" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">nil</text>
