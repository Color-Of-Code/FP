  <text x="573" y="18" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="var(--fp-label-fill)">fold :: (b ⟶ a ⟶ b) ⟶ b ⟶ [a] ⟶ b</text>
