        </g>
      </g>
      <g class="action-node">
        <title>The recursive call: fold itself, with the same f, the new accumulator and the shorter tail.</title>
        <rect x="713" y="51" width="180" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="803" y="73" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">again : fold f acc' rest</text>
        <g class="pin pin-in">
          <rect x="709" y="58" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="719" y="62" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">f</text>
