<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510.4 316" width="510.4" height="316" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">concurrency motivation</title>
  <desc id="diagram-description">Functional programming diagram: concurrency motivation</desc>
  <style>:root {
