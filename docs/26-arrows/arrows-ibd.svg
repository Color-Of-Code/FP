        <path d="M303.9,95.0 L331.8,95.0 Q336.8,95.0 336.8,90.0 L336.8,90.0 Q336.8,85.0 341.8,85.0 L433.8,85.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="391.3" y="79" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">first component</text>
