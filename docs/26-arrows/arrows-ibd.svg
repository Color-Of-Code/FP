      <g class="object-node hof">
        <title>arrow : A b c — an arrow from b to c (for plain functions: b ⟶ c); fixed when first lifted it</title>
        <rect x="134" y="30" width="192.8" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
        <text x="230.4" y="42" text-anchor="middle" font-size="9" font-style="italic" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-hof-stroke)">«function»</text>
        <text x="230.4" y="56" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">arrow : A b c — captured</text>
      </g>
      <g class="action-node">
