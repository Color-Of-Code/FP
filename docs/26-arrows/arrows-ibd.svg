      </g>
      <g class="object-node">
        <title>The pair the lifted arrow runs on: supplied when it is called.</title>
        <rect x="70" y="71" width="236" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
        <text x="188" y="90" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">p : (b, d) — supplied when run</text>
      </g>
      <g class="action-node">
        <title>Take the pair apart: b is for the arrow, d is set aside.</title>
        <rect x="370" y="68" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="430" y="90" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">split : (b, d)</text>
