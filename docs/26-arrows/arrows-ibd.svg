          <text x="459.79999999999995" y="83.33333333333333" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">b</text>
        </g>
        <g class="pin pin-out">
          <rect x="569.8" y="72" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="action-node">
        <title>Put the pair back together: the arrow's result and the untouched d.</title>
        <rect x="659.8" y="72" width="144" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="731.8" y="94" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">join_pair : (c, d)</text>
        <g class="pin pin-in">
          <rect x="655.8" y="82.66666666666667" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="665.8" y="86.66666666666667" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">c</text>
        </g>
        <g class="pin pin-in">
          <rect x="655.8" y="97.33333333333333" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="665.8" y="101.33333333333333" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">d</text>
        </g>
        <g class="pin pin-out">
          <rect x="799.8" y="90" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="port port-left">
        <title>p : (b, d) — the pair the lifted arrow runs on, supplied on every call</title>
        <rect x="-4" y="100" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1.5"/>
        <text x="-7" y="98" font-size="9" font-family="sans-serif" text-anchor="end" fill="var(--fp-port-label)">p : (b, d)</text>
      </g>
      <g class="port port-right">
        <title>result : (c, d) — the arrow's output paired with the untouched second component</title>
        <rect x="901.8" y="90" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1.5"/>
        <text x="912.8" y="88" font-size="9" font-family="sans-serif" text-anchor="start" fill="var(--fp-port-label)">result : (c, d)</text>
