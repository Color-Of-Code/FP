      <g class="port port-left">
        <title>s : the whole structure — actual parameter, supplied on every call</title>
        <rect x="-4" y="111" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1.5"/>
        <text x="-7" y="109" font-size="9" font-family="sans-serif" text-anchor="end" fill="var(--fp-port-label)">s : s</text>
