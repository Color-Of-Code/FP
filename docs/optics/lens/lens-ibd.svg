          <text x="342.93333333333334" y="120.33333333333333" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">s</text>
        </g>
        <g class="pin pin-out">
          <rect x="452.93333333333334" y="109" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
