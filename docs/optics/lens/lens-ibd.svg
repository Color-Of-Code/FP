      </g>
      <g class="object-node hof">
        <title>l : Lens s a — focuses on one field of s: supplies both get and set; fixed when over was applied</title>
        <rect x="70.00000000000001" y="59" width="185.6" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
        <text x="162.8" y="71" text-anchor="middle" font-size="9" font-style="italic" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-hof-stroke)">«function»</text>
        <text x="162.8" y="85" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">l : Lens s a — captured</text>
      </g>
      <g class="object-node hof">
        <title>f : a ⟶ a — update applied to the focused field only; fixed when over was applied</title>
        <rect x="319.6" y="39" width="164" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
        <text x="401.6" y="51" text-anchor="middle" font-size="9" font-style="italic" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-hof-stroke)">«function»</text>
