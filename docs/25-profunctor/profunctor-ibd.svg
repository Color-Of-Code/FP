  <defs>
    <marker id="arrowFilled" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 L2.5,5 Z" fill="var(--fp-edge-stroke)"/>
    </marker>
    <marker id="arrowOpen" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.25"/>
    </marker>
    <marker id="arrowHof" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 L2.5,5 Z" fill="var(--fp-hof-edge)"/>
    </marker>
  </defs>
  <text x="638.2" y="18" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="var(--fp-label-fill)">dimap :: (A' ⟶ A) ⟶ (B ⟶ B') ⟶ P A B ⟶ P A' B'</text>
  <text x="638.2" y="35" text-anchor="middle" font-size="11" font-weight="normal" font-family="sans-serif" fill="var(--fp-secondary-text)">inside dimap (for functions): f adapts the input, h runs, g adapts the output</text>
  <g transform="translate(0,44) scale(1)">
    <g transform="translate(44,0)">
      <rect x="0" y="0" width="1161.4" height="204" fill="var(--fp-frame-fill)" stroke="var(--fp-frame-stroke)" stroke-width="1.5"/>
      <g class="diagram-frame-tab tab-block">
        <path d="M0,0 L109,0 L109,12 L99,22 L0,22 Z" fill="var(--fp-frame-tab-fill)" stroke="var(--fp-frame-stroke)" stroke-width="1"/>
        <text x="54.5" y="12" text-anchor="middle" font-size="10" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">«block» adapted</text>
      </g>
      <g class="edge">
        <path d="M4.0,154.0 L332.7,154.0 Q336.2,154.0 336.2,150.5 L336.2,150.5 Q336.2,147.0 339.7,147.0 L343.5,147.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="170.10000000000002" y="148" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">new input</text>
      </g>
      <g class="edge hof-edge">
        <path d="M241.2,117.0 L330.2,117.0 Q336.2,117.0 336.2,123.0 L336.2,125.3 Q336.2,129.0 339.9,129.0 L343.5,129.0" fill="none" stroke="var(--fp-hof-edge)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowHof)"/>
        <text x="288.70000000000005" y="111" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">contravariant</text>
      </g>
      <g class="edge">
        <path d="M487.5,138.0 L619.2,138.0 Q625.2,138.0 625.2,132.0 L625.2,117.9 Q625.2,113.0 630.1,113.0 L634.9,113.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="558.3666666666667" y="132" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">A (internal only)</text>
      </g>
      <g class="edge hof-edge">
        <path d="M510.2,83.0 L619.2,83.0 Q625.2,83.0 625.2,89.0 L625.2,90.1 Q625.2,95.0 630.1,95.0 L634.9,95.0" fill="none" stroke="var(--fp-hof-edge)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowHof)"/>
        <text x="567.7" y="77" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">unchanged</text>
      </g>
      <g class="edge">
        <path d="M778.9,104.0 L915.4,104.0 Q921.4,104.0 921.4,98.0 L921.4,67.0 L921.4,67.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="852.1666666666667" y="98" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">B (internal only)</text>
      </g>
      <g class="edge hof-edge">
        <path d="M806.4,49.0 L919.4,49.0" fill="none" stroke="var(--fp-hof-edge)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowHof)"/>
        <text x="868.9000000000001" y="43" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">covariant</text>
      </g>
      <g class="edge">
        <path d="M1063.4,58.0 L1145.4,58.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      </g>
      <g class="object-node hof">
        <title>f : A' ⟶ A — pre-map (contravariant): adapts the new input to what h expects; fixed when dimap was applied</title>
        <rect x="70.00000000000001" y="98" width="171.20000000000002" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
        <text x="155.60000000000002" y="110" text-anchor="middle" font-size="9" font-style="italic" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-hof-stroke)">«function»</text>
        <text x="155.60000000000002" y="124" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">f : A' ⟶ A — captured</text>
      </g>
      <g class="object-node hof">
        <title>h : A ⟶ B — the original profunctor (here a plain function), left unchanged</title>
        <rect x="346.20000000000005" y="64" width="164" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
        <text x="428.20000000000005" y="76" text-anchor="middle" font-size="9" font-style="italic" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-hof-stroke)">«function»</text>
        <text x="428.20000000000005" y="90" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">h : A ⟶ B — captured</text>
      </g>
      <g class="object-node hof">
        <title>g : B ⟶ B' — post-map (covariant): adapts h's output to the new output type</title>
        <rect x="635.2" y="30" width="171.20000000000002" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
        <text x="720.8000000000001" y="42" text-anchor="middle" font-size="9" font-style="italic" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-hof-stroke)">«function»</text>
        <text x="720.8000000000001" y="56" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">g : B ⟶ B' — captured</text>
      </g>
      <g class="action-node">
        <title>Pre-map: turn the new input A' into the A that h expects.</title>
        <rect x="363.53333333333336" y="116" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="423.53333333333336" y="138" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">pre : f x</text>
        <g class="pin pin-in">
          <rect x="359.53333333333336" y="126.66666666666666" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="369.53333333333336" y="130.66666666666666" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">f</text>
        </g>
        <g class="pin pin-in">
          <rect x="359.53333333333336" y="141.33333333333334" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="369.53333333333336" y="145.33333333333334" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">a</text>
        </g>
        <g class="pin pin-out">
          <rect x="479.53333333333336" y="134" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="action-node">
        <title>The original function, running on the adapted input.</title>
        <rect x="654.9333333333334" y="82" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="714.9333333333334" y="104" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">run : h a</text>
        <g class="pin pin-in">
          <rect x="650.9333333333334" y="92.66666666666667" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="660.9333333333334" y="96.66666666666667" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">h</text>
        </g>
        <g class="pin pin-in">
          <rect x="650.9333333333334" y="107.33333333333333" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="660.9333333333334" y="111.33333333333333" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">a</text>
        </g>
        <g class="pin pin-out">
          <rect x="770.9333333333334" y="100" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="action-node">
        <title>Post-map: turn h's B into the new output type B'.</title>
        <rect x="939.4000000000001" y="36" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="999.4000000000001" y="58" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">post : g b</text>
        <g class="pin pin-in">
          <rect x="935.4000000000001" y="46.666666666666664" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="945.4000000000001" y="50.666666666666664" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">g</text>
        </g>
        <g class="pin pin-in">
          <rect x="935.4000000000001" y="61.33333333333333" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="945.4000000000001" y="65.33333333333333" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">b</text>
        </g>
        <g class="pin pin-out">
          <rect x="1055.4" y="54" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="port port-left">
        <title>x : A' — actual parameter, supplied on every call of the adapted function</title>
        <rect x="-4" y="150" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1.5"/>
        <text x="-7" y="148" font-size="9" font-family="sans-serif" text-anchor="end" fill="var(--fp-port-label)">x : A'</text>
      </g>
      <g class="port port-right">
        <title>result : B' — what each call returns: g (h (f x))</title>
        <rect x="1157.4" y="54" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1.5"/>
        <text x="1168.4" y="52" font-size="9" font-family="sans-serif" text-anchor="start" fill="var(--fp-port-label)">result : B'</text>
      </g>
    </g>
  </g>
</svg>
