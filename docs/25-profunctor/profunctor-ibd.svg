<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1276.4 248" width="1276.4" height="248" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">dimap :: (A' ⟶ A) ⟶ (B ⟶ B') ⟶ P A B ⟶ P A' B' — inside dimap (for functions): f adapts the input, h runs, g adapts the output</title>
  <desc id="diagram-description">Functional programming diagram: dimap :: (A' ⟶ A) ⟶ (B ⟶ B') ⟶ P A B ⟶ P A' B' — inside dimap (for functions): f adapts the input, h runs, g adapts the output</desc>
