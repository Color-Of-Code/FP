<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1308.4 217" width="1308.4" height="217" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">toCps :: (a ⟶ b) ⟶ (a ⟶ (b ⟶ r) ⟶ r) — inside toCps: f computes b, but b is handed to the continuation k instead of being returned</title>
