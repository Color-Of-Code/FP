<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1083.8 207" width="1083.8" height="207" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">uncurry :: (a ⟶ b ⟶ c) ⟶ ((a, b) ⟶ c) — inside uncurry: the pair is taken apart and g is applied in two stages</title>
  <desc id="diagram-description">Functional programming diagram: uncurry :: (a ⟶ b ⟶ c) ⟶ ((a, b) ⟶ c) — inside uncurry: the pair is taken apart and g is applied in two stages</desc>
  <style>:root {
