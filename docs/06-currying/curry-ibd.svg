<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 831 207" width="831" height="207" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">curry :: ((a, b) ⟶ c) ⟶ (a ⟶ b ⟶ c) — inside curry: the two separately supplied arguments are packed into a pair for f</title>
  <desc id="diagram-description">Functional programming diagram: curry :: ((a, b) ⟶ c) ⟶ (a ⟶ b ⟶ c) — inside curry: the two separately supplied arguments are packed into a pair for f</desc>
  <style>:root {
  color-scheme: light;
  --fp-canvas: #ffffff;
  --fp-action-fill: #dafbe1;
  --fp-action-stroke: #1a7f37;
  --fp-obj-fill: #f6f8fa;
  --fp-obj-stroke: #57606a;
  --fp-hof-fill: #ddf4ff;
  --fp-hof-stroke: #0969da;
  --fp-pin-fill: #eaeef2;
  --fp-pin-stroke: #57606a;
  --fp-frame-fill: #ffffff;
  --fp-frame-stroke: #6e7781;
  --fp-frame-tab-fill: #eaeef2;
  --fp-init-fill: #24292f;
