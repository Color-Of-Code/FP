      <text x="121.6" y="234" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">trim :: b ⟶ c</text>
    </g>
    <g class="object-node hof">
      <title>Reusable formatting step.</title>
      <rect x="198.39999999999998" y="220" width="128" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
