<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 659.6 228" width="659.6" height="228" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title"> Function composition applies f then g </title>
  <desc id="diagram-description">Functional programming diagram:  Function composition applies f then g </desc>
  <style>:root {
