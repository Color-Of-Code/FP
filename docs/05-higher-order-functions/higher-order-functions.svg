<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 433 300" width="433" height="300" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title"> Higher-order functions accept and return functions </title>
  <desc id="diagram-description">Functional programming diagram:  Higher-order functions accept and return functions </desc>
  <style>:root {
  color-scheme: light;
  --fp-canvas: #ffffff;
  --fp-action-fill: #dafbe1;
  --fp-action-stroke: #1a7f37;
  --fp-obj-fill: #f6f8fa;
  --fp-obj-stroke: #57606a;
  --fp-hof-fill: #ddf4ff;
  --fp-hof-stroke: #0969da;
  --fp-pin-fill: #eaeef2;
  --fp-pin-stroke: #57606a;
  --fp-frame-fill: #ffffff;
  --fp-frame-stroke: #6e7781;
  --fp-frame-tab-fill: #eaeef2;
  --fp-init-fill: #24292f;
  --fp-final-stroke: #24292f;
  --fp-final-fill: #24292f;
  --fp-edge-stroke: #57606a;
  --fp-hof-edge: #0969da;
  --fp-label-fill: #24292f;
  --fp-secondary-text: #57606a;
  --fp-pin-label: #57606a;
  --fp-port-label: #57606a;
  --fp-decision-fill: #fff8c5;
  --fp-decision-stroke: #9a6700;
  --fp-decision-label: #633c01;
  --fp-note-fill: #fff8c5;
  --fp-note-fold-fill: #ffdf5d;
  --fp-note-stroke: #9a6700;
  --fp-note-label: #633c01;
  --fp-lane-fill: #f6f8fa;
  --fp-lane-stroke: #6e7781;
  --fp-lane-header: #eaeef2;
  --fp-error-text: #cf222e;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
  --fp-canvas: #0d1117;
  --fp-action-fill: #0f2d1f;
  --fp-action-stroke: #3fb950;
  --fp-obj-fill: #161b22;
  --fp-obj-stroke: #8b949e;
  --fp-hof-fill: #082f49;
  --fp-hof-stroke: #79c0ff;
  --fp-pin-fill: #30363d;
  --fp-pin-stroke: #8b949e;
  --fp-frame-fill: #0d1117;
  --fp-frame-stroke: #6e7681;
  --fp-frame-tab-fill: #21262d;
  --fp-init-fill: #e6edf3;
  --fp-final-stroke: #e6edf3;
  --fp-final-fill: #e6edf3;
  --fp-edge-stroke: #8b949e;
  --fp-hof-edge: #79c0ff;
  --fp-label-fill: #e6edf3;
  --fp-secondary-text: #9198a1;
  --fp-pin-label: #c9d1d9;
  --fp-port-label: #c9d1d9;
  --fp-decision-fill: #3d2c00;
  --fp-decision-stroke: #d29922;
  --fp-decision-label: #f0c674;
  --fp-note-fill: #3d2c00;
  --fp-note-fold-fill: #573a00;
  --fp-note-stroke: #d29922;
  --fp-note-label: #f0c674;
  --fp-lane-fill: #161b22;
  --fp-lane-stroke: #6e7681;
  --fp-lane-header: #21262d;
  --fp-error-text: #ff7b72;
  }
}</style>
  <defs>
    <marker id="arrowFilled" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 L2.5,5 Z" fill="var(--fp-edge-stroke)"/>
    </marker>
    <marker id="arrowOpen" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.25"/>
    </marker>
    <marker id="arrowHof" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 L2.5,5 Z" fill="var(--fp-hof-edge)"/>
    </marker>
  </defs>
  <text x="216.5" y="18" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="var(--fp-label-fill)"> Higher-order functions accept and return functions </text>
  <g transform="translate(0,28) scale(1.2810650887573964)">
    <rect x="0" y="0" width="338" height="212" fill="var(--fp-frame-fill)" stroke="var(--fp-frame-stroke)" stroke-width="1.5"/>
    <g class="diagram-frame-tab tab-activity">
      <path d="M0,0 L200,0 L200,12 L190,22 L0,22 Z" fill="var(--fp-frame-tab-fill)" stroke="var(--fp-frame-stroke)" stroke-width="1"/>
      <text x="100" y="12" text-anchor="middle" font-size="10" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">«activity» HigherOrderExamples</text>
    </g>
    <g class="edge hof-edge">
      <path d="M146.0,123.0 L154.0,123.0" fill="none" stroke="var(--fp-hof-edge)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowHof)"/>
    </g>
    <g class="edge">
      <path d="M146.0,175.0 L151.0,175.0 Q156.0,175.0 156.0,170.0 L156.0,141.0 L156.0,141.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
    </g>
    <g class="edge">
      <path d="M146.0,62.0 L150.0,62.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
    </g>
    <g class="action-node">
      <title>map accepts a function value and applies it to the container.</title>
      <rect x="174" y="110" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
      <text class="action-label" x="234" y="132" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">map</text>
      <g class="pin pin-in">
        <rect x="170" y="120.66666666666667" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        <text x="180" y="124.66666666666667" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">function</text>
      </g>
      <g class="pin pin-in">
        <rect x="170" y="135.33333333333334" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        <text x="180" y="139.33333333333334" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">container</text>
      </g>
      <g class="pin pin-out">
        <rect x="290" y="128" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
    </g>
    <g class="action-node">
      <rect x="170" y="40" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
      <text class="action-label" x="230" y="62" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">constant</text>
      <g class="pin pin-in">
        <rect x="166" y="58" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        <text x="176" y="62" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">value</text>
      </g>
      <g class="pin pin-out">
        <rect x="286" y="58" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
    </g>
    <g class="object-node hof">
      <title>A function passed to map as an argument.</title>
      <rect x="36" y="104" width="110" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
      <text x="91" y="116" text-anchor="middle" font-size="9" font-style="italic" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-hof-stroke)">«function»</text>
      <text x="91" y="130" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">f :: a ⟶ b</text>
    </g>
    <g class="object-node">
      <rect x="36" y="156" width="110" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
      <text x="91" y="175" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">Container a</text>
    </g>
    <g class="object-node">
      <rect x="36" y="43" width="110" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
      <text x="91" y="62" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">a</text>
    </g>
  </g>
</svg>
