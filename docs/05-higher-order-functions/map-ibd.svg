<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1186 193" width="1186" height="193" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">map :: (a ⟶ b) ⟶ Container a ⟶ Container b — inside map: f is applied to each element; the shape bypasses f and is refilled with the results</title>
  <desc id="diagram-description">Functional programming diagram: map :: (a ⟶ b) ⟶ Container a ⟶ Container b — inside map: f is applied to each element; the shape bypasses f and is refilled with the results</desc>
  <style>:root {
