    </g>
    <g class="edge">
      <path d="M337.6,230.0 L345.6,230.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
    </g>
