<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 922 338" width="922" height="338" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">transformer motivation</title>
  <desc id="diagram-description">Functional programming diagram: transformer motivation</desc>
  <style>:root {
  color-scheme: light;
  --fp-canvas: #ffffff;
  --fp-action-fill: #dafbe1;
