        <text x="288" y="111" text-anchor="end" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">result</text>
      </g>
    </g>
    <g class="action-node">
      <title>bind threads the configured effects and short-circuits on failure.</title>
