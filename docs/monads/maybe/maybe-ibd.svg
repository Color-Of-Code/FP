<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 796 222" width="796" height="222" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">bind :: Maybe a ⟶ (a ⟶ Maybe b) ⟶ Maybe b — inside bind: Just passes its payload to f; Nothing skips f — also called: flatMap, andThen / and_then, SelectMany, chain, &gt;&gt;=</title>
