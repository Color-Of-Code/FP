<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1335 224" width="1335" height="224" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">With pure + bind: every step has the same shape; bind is the glue</title>
  <desc id="diagram-description">Functional programming diagram: With pure + bind: every step has the same shape; bind is the glue</desc>
  <style>:root {
  color-scheme: light;
  --fp-canvas: #ffffff;
  --fp-action-fill: #dafbe1;
  --fp-action-stroke: #1a7f37;
  --fp-obj-fill: #f6f8fa;
  --fp-obj-stroke: #57606a;
  --fp-hof-fill: #ddf4ff;
  --fp-hof-stroke: #0969da;
  --fp-pin-fill: #eaeef2;
  --fp-pin-stroke: #57606a;
  --fp-frame-fill: #ffffff;
  --fp-frame-stroke: #6e7781;
  --fp-frame-tab-fill: #eaeef2;
  --fp-init-fill: #24292f;
  --fp-final-stroke: #24292f;
  --fp-final-fill: #24292f;
  --fp-edge-stroke: #57606a;
  --fp-hof-edge: #0969da;
  --fp-label-fill: #24292f;
  --fp-secondary-text: #57606a;
  --fp-pin-label: #57606a;
  --fp-port-label: #57606a;
  --fp-decision-fill: #fff8c5;
  --fp-decision-stroke: #9a6700;
  --fp-decision-label: #633c01;
  --fp-note-fill: #fff8c5;
  --fp-note-fold-fill: #ffdf5d;
  --fp-note-stroke: #9a6700;
  --fp-note-label: #633c01;
  --fp-lane-fill: #f6f8fa;
  --fp-lane-stroke: #6e7781;
  --fp-lane-header: #eaeef2;
  --fp-error-text: #cf222e;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
  --fp-canvas: #0d1117;
  --fp-action-fill: #0f2d1f;
  --fp-action-stroke: #3fb950;
  --fp-obj-fill: #161b22;
  --fp-obj-stroke: #8b949e;
  --fp-hof-fill: #082f49;
  --fp-hof-stroke: #79c0ff;
  --fp-pin-fill: #30363d;
  --fp-pin-stroke: #8b949e;
  --fp-frame-fill: #0d1117;
  --fp-frame-stroke: #6e7681;
  --fp-frame-tab-fill: #21262d;
  --fp-init-fill: #e6edf3;
  --fp-final-stroke: #e6edf3;
  --fp-final-fill: #e6edf3;
  --fp-edge-stroke: #8b949e;
  --fp-hof-edge: #79c0ff;
  --fp-label-fill: #e6edf3;
  --fp-secondary-text: #9198a1;
  --fp-pin-label: #c9d1d9;
  --fp-port-label: #c9d1d9;
  --fp-decision-fill: #3d2c00;
  --fp-decision-stroke: #d29922;
  --fp-decision-label: #f0c674;
  --fp-note-fill: #3d2c00;
  --fp-note-fold-fill: #573a00;
  --fp-note-stroke: #d29922;
  --fp-note-label: #f0c674;
  --fp-lane-fill: #161b22;
  --fp-lane-stroke: #6e7681;
  --fp-lane-header: #21262d;
  --fp-error-text: #ff7b72;
  }
}</style>
  <defs>
    <marker id="arrowFilled" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 L2.5,5 Z" fill="var(--fp-edge-stroke)"/>
    </marker>
    <marker id="arrowOpen" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.25"/>
    </marker>
    <marker id="arrowHof" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 L2.5,5 Z" fill="var(--fp-hof-edge)"/>
    </marker>
  </defs>
  <text x="667.5" y="18" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="var(--fp-label-fill)">With pure + bind: every step has the same shape; bind is the glue</text>
  <g transform="translate(0,28) scale(1)">
    <rect x="0" y="0" width="1335" height="196" fill="var(--fp-frame-fill)" stroke="var(--fp-frame-stroke)" stroke-width="1.5"/>
    <g class="diagram-frame-tab tab-activity">
      <path d="M0,0 L171,0 L171,12 L161,22 L0,22 Z" fill="var(--fp-frame-tab-fill)" stroke="var(--fp-frame-stroke)" stroke-width="1"/>
      <text x="85.5" y="12" text-anchor="middle" font-size="10" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">«activity» lookupUserCity</text>
    </g>
    <g class="swimlane lane-plain">
      <rect x="6" y="28" width="1323" height="85" fill="var(--fp-lane-fill)" stroke="var(--fp-lane-stroke)" stroke-width="1" rx="4" ry="4"/>
      <rect x="6" y="28" width="1323" height="18" fill="var(--fp-lane-header)" stroke="var(--fp-lane-stroke)" stroke-width="1" rx="4" ry="4"/>
      <text x="16" y="38" text-anchor="start" font-size="10" font-weight="bold" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">Plain values &amp; functions</text>
    </g>
    <g class="swimlane lane-monad">
      <rect x="6" y="113" width="1323" height="77" fill="var(--fp-lane-fill)" stroke="var(--fp-lane-stroke)" stroke-width="1" rx="4" ry="4"/>
      <rect x="6" y="113" width="1323" height="18" fill="var(--fp-lane-header)" stroke="var(--fp-lane-stroke)" stroke-width="1" rx="4" ry="4"/>
      <text x="16" y="123" text-anchor="start" font-size="10" font-weight="bold" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">Maybe monad</text>
    </g>
    <g class="edge">
      <path d="M240.0,92.0 L240.0,118.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
    </g>
    <g class="edge">
      <path d="M300.0,156.0 L372.0,156.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      <text x="344" y="150" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">Maybe UserId</text>
    </g>
    <g class="edge">
      <path d="M508.0,156.0 L570.0,156.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      <text x="547" y="150" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">Maybe User</text>
    </g>
    <g class="edge">
      <path d="M706.0,156.0 L783.0,156.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      <text x="752.5" y="150" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">Maybe Address</text>
    </g>
    <g class="edge">
      <path d="M919.0,156.0 L981.0,156.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      <text x="958" y="150" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">Maybe City</text>
    </g>
    <g class="edge">
      <path d="M1113.0,156.0 L1238.0,156.0 Q1244.0,156.0 1244.0,150.0 L1244.0,104.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      <text x="1180.5" y="150" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">Maybe String</text>
    </g>
    <g class="edge hof-edge">
      <path d="M448.0,92.0 L448.0,118.0" fill="none" stroke="var(--fp-hof-edge)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowHof)"/>
    </g>
    <g class="edge hof-edge">
      <path d="M646.0,92.0 L646.0,118.0" fill="none" stroke="var(--fp-hof-edge)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowHof)"/>
    </g>
    <g class="edge hof-edge">
      <path d="M859.0,92.0 L859.0,118.0" fill="none" stroke="var(--fp-hof-edge)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowHof)"/>
    </g>
    <g class="edge hof-edge">
      <path d="M1057.0,92.0 L1057.0,118.0" fill="none" stroke="var(--fp-hof-edge)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowHof)"/>
    </g>
    <g class="action-node">
      <title>pure : UserId → Maybe UserId. Lifts the plain value into Maybe so the chain can start uniformly with bind.</title>
      <rect x="180" y="134" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
      <text class="action-label" x="240" y="156" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">pureId</text>
      <g class="pin pin-in">
        <rect x="176" y="152" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
      <g class="pin pin-out">
        <rect x="296" y="152" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
    </g>
    <g class="action-node">
      <title>&gt;&gt;= : takes Maybe UserId and (UserId → Maybe User). Unwraps Just id and applies findUser; propagates Nothing.</title>
      <rect x="388" y="134" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
      <text class="action-label" x="448" y="156" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">bindUser</text>
      <g class="pin pin-in">
        <rect x="384" y="144.66666666666666" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
      <g class="pin pin-in">
        <rect x="384" y="159.33333333333334" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
      <g class="pin pin-out">
        <rect x="504" y="152" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
    </g>
    <g class="action-node">
      <title>&gt;&gt;= : takes Maybe User and (User → Maybe Address). Same pattern.</title>
      <rect x="586" y="134" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
      <text class="action-label" x="646" y="156" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">bindAddr</text>
      <g class="pin pin-in">
        <rect x="582" y="144.66666666666666" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
      <g class="pin pin-in">
        <rect x="582" y="159.33333333333334" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
      <g class="pin pin-out">
        <rect x="702" y="152" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
    </g>
    <g class="action-node">
      <title>&gt;&gt;= : takes Maybe Address and (Address → Maybe City). Same pattern.</title>
      <rect x="799" y="134" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
      <text class="action-label" x="859" y="156" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">bindCity</text>
      <g class="pin pin-in">
        <rect x="795" y="144.66666666666666" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
      <g class="pin pin-in">
        <rect x="795" y="159.33333333333334" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
      <g class="pin pin-out">
        <rect x="915" y="152" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
    </g>
    <g class="action-node">
      <title>&gt;&gt;= : takes Maybe City and (City → Maybe String). Same pattern.</title>
      <rect x="997" y="134" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
      <text class="action-label" x="1057" y="156" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">bindName</text>
      <g class="pin pin-in">
        <rect x="993" y="144.66666666666666" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
      <g class="pin pin-in">
        <rect x="993" y="159.33333333333334" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
      <g class="pin pin-out">
        <rect x="1113" y="152" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
    </g>
    <g class="object-node">
      <title>The input: a plain UserId.</title>
      <rect x="185" y="54" width="110" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
      <text x="240" y="73" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">UserId</text>
    </g>
    <g class="object-node hof">
      <title>find_user : UserId → Maybe User. Passed as an argument to bind — its input type is UserId, not Maybe UserId, so it cannot sit on the main flow.</title>
      <rect x="369.6" y="54" width="156.8" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
      <text x="448" y="66" text-anchor="middle" font-size="9" font-style="italic" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-hof-stroke)">«function»</text>
      <text x="448" y="80" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">UserId ⟶ Maybe User</text>
    </g>
    <g class="object-node hof">
      <title>find_address : User → Maybe Address. Same: supplied to bind as the continuation.</title>
      <rect x="564" y="54" width="164" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
      <text x="646" y="66" text-anchor="middle" font-size="9" font-style="italic" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-hof-stroke)">«function»</text>
      <text x="646" y="80" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">User ⟶ Maybe Address</text>
    </g>
    <g class="object-node hof">
      <title>find_city : Address → Maybe City. Same: supplied to bind as the continuation.</title>
      <rect x="777" y="54" width="164" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
      <text x="859" y="66" text-anchor="middle" font-size="9" font-style="italic" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-hof-stroke)">«function»</text>
      <text x="859" y="80" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">Address ⟶ Maybe City</text>
    </g>
    <g class="object-node hof">
      <title>lift_name : City → Maybe String (= pure ∘ .name). Lifts the plain String back into Maybe.</title>
      <rect x="978.6" y="54" width="156.8" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
      <text x="1057" y="66" text-anchor="middle" font-size="9" font-style="italic" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-hof-stroke)">«function»</text>
      <text x="1057" y="80" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">City ⟶ Maybe String</text>
    </g>
    <g class="object-node">
      <title>Maybe String — Just city.name on success; Nothing if any step failed.\nNo explicit null checks anywhere in this chain; pure starts it, bind drives it.</title>
      <rect x="1189" y="54" width="110" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
      <text x="1244" y="73" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">Maybe String</text>
    </g>
  </g>
</svg>
