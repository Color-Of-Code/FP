    <g class="edge hof-edge">
      <path d="M248.4,49.0 L256.4,49.0" fill="none" stroke="var(--fp-hof-edge)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowHof)"/>
