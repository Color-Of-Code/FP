    <g class="edge">
      <path d="M248.4,101.0 L253.4,101.0 Q258.4,101.0 258.4,96.0 L258.4,63.0 L258.4,63.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
