<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1192.8000000000002 224" width="1192.8000000000002" height="224" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">With pure + bind: Left propagates automatically; every step has the same shape</title>
  <desc id="diagram-description">Functional programming diagram: With pure + bind: Left propagates automatically; every step has the same shape</desc>
  <style>:root {
