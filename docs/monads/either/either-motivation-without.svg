<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1515 186" width="1515" height="186" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Without bind: explicit Left guard at every step</title>
  <desc id="diagram-description">Functional programming diagram: Without bind: explicit Left guard at every step</desc>
  <style>:root {
  color-scheme: light;
  --fp-canvas: #ffffff;
  --fp-action-fill: #dafbe1;
  --fp-action-stroke: #1a7f37;
  --fp-obj-fill: #f6f8fa;
  --fp-obj-stroke: #57606a;
  --fp-hof-fill: #ddf4ff;
  --fp-hof-stroke: #0969da;
  --fp-pin-fill: #eaeef2;
  --fp-pin-stroke: #57606a;
  --fp-frame-fill: #ffffff;
  --fp-frame-stroke: #6e7781;
  --fp-frame-tab-fill: #eaeef2;
  --fp-init-fill: #24292f;
  --fp-final-stroke: #24292f;
  --fp-final-fill: #24292f;
  --fp-edge-stroke: #57606a;
  --fp-hof-edge: #0969da;
  --fp-label-fill: #24292f;
  --fp-secondary-text: #57606a;
  --fp-pin-label: #57606a;
  --fp-port-label: #57606a;
  --fp-decision-fill: #fff8c5;
  --fp-decision-stroke: #9a6700;
  --fp-decision-label: #633c01;
  --fp-note-fill: #fff8c5;
  --fp-note-fold-fill: #ffdf5d;
  --fp-note-stroke: #9a6700;
  --fp-note-label: #633c01;
  --fp-lane-fill: #f6f8fa;
  --fp-lane-stroke: #6e7781;
  --fp-lane-header: #eaeef2;
  --fp-error-text: #cf222e;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
  --fp-canvas: #0d1117;
  --fp-action-fill: #0f2d1f;
  --fp-action-stroke: #3fb950;
  --fp-obj-fill: #161b22;
  --fp-obj-stroke: #8b949e;
  --fp-hof-fill: #082f49;
  --fp-hof-stroke: #79c0ff;
  --fp-pin-fill: #30363d;
  --fp-pin-stroke: #8b949e;
  --fp-frame-fill: #0d1117;
  --fp-frame-stroke: #6e7681;
  --fp-frame-tab-fill: #21262d;
  --fp-init-fill: #e6edf3;
  --fp-final-stroke: #e6edf3;
  --fp-final-fill: #e6edf3;
  --fp-edge-stroke: #8b949e;
  --fp-hof-edge: #79c0ff;
  --fp-label-fill: #e6edf3;
  --fp-secondary-text: #9198a1;
  --fp-pin-label: #c9d1d9;
  --fp-port-label: #c9d1d9;
  --fp-decision-fill: #3d2c00;
  --fp-decision-stroke: #d29922;
  --fp-decision-label: #f0c674;
  --fp-note-fill: #3d2c00;
  --fp-note-fold-fill: #573a00;
  --fp-note-stroke: #d29922;
  --fp-note-label: #f0c674;
  --fp-lane-fill: #161b22;
  --fp-lane-stroke: #6e7681;
  --fp-lane-header: #21262d;
  --fp-error-text: #ff7b72;
  }
}</style>
  <defs>
    <marker id="arrowFilled" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 L2.5,5 Z" fill="var(--fp-edge-stroke)"/>
    </marker>
    <marker id="arrowOpen" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.25"/>
    </marker>
    <marker id="arrowHof" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 L2.5,5 Z" fill="var(--fp-hof-edge)"/>
    </marker>
  </defs>
  <text x="757.5" y="18" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="var(--fp-label-fill)">Without bind: explicit Left guard at every step</text>
  <g transform="translate(0,28) scale(1)">
    <rect x="0" y="0" width="1515" height="158" fill="var(--fp-frame-fill)" stroke="var(--fp-frame-stroke)" stroke-width="1.5"/>
    <g class="diagram-frame-tab tab-activity">
      <path d="M0,0 L189.6,0 L189.6,12 L179.6,22 L0,22 Z" fill="var(--fp-frame-tab-fill)" stroke="var(--fp-frame-stroke)" stroke-width="1"/>
      <text x="94.8" y="12" text-anchor="middle" font-size="10" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">«activity» parseValidateSave</text>
    </g>
    <g class="edge">
      <path d="M146.0,62.0 L150.0,62.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
    </g>
    <g class="edge">
      <path d="M294.0,62.0 L397.0,62.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      <text x="353.5" y="56" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">Either e Parsed</text>
    </g>
    <g class="edge">
      <path d="M433.0,77.0 L433.0,114.0 Q433.0,120.0 439.0,120.0 L1311.0,120.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      <text x="878" y="114" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">Left e</text>
    </g>
    <g class="edge">
      <path d="M457.0,62.0 L541.0,62.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      <text x="505" y="56" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">Right parsed</text>
    </g>
    <g class="edge">
      <path d="M685.0,62.0 L783.0,62.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      <text x="742" y="56" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">Either e Valid</text>
    </g>
    <g class="edge">
      <path d="M819.0,77.0 L819.0,114.0 Q819.0,120.0 825.0,120.0 L1311.0,120.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      <text x="1071" y="114" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">Left e</text>
    </g>
    <g class="edge">
      <path d="M843.0,62.0 L922.0,62.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      <text x="888.5" y="56" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">Right valid</text>
    </g>
    <g class="edge">
      <path d="M1066.0,62.0 L1168.0,62.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      <text x="1125" y="56" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">Either e Saved</text>
    </g>
    <g class="edge">
      <path d="M1204.0,77.0 L1204.0,114.0 Q1204.0,120.0 1210.0,120.0 L1311.0,120.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      <text x="1263.5" y="114" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">Left e</text>
    </g>
    <g class="edge">
      <path d="M1228.0,62.0 L1357.0,62.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      <text x="1298.5" y="56" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">Right saved</text>
    </g>
    <g class="edge">
      <path d="M1353.0,120.0 L1357.0,120.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
    </g>
    <g class="action-node">
      <title>parse(raw) → Either e Parsed. Returns Right parsed on success or Left e on a parse error.</title>
      <rect x="170" y="40" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
      <text class="action-label" x="230" y="62" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">parse</text>
      <g class="pin pin-in">
        <rect x="166" y="58" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        <text x="176" y="62" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">raw</text>
      </g>
      <g class="pin pin-out">
        <rect x="286" y="58" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
    </g>
    <g class="action-node">
      <title>validate(parsed) → Either e Valid. May return Left if a business rule is violated.</title>
      <rect x="561" y="40" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
      <text class="action-label" x="621" y="62" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">validate</text>
      <g class="pin pin-in">
        <rect x="557" y="58" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        <text x="567" y="62" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">parsed</text>
      </g>
      <g class="pin pin-out">
        <rect x="677" y="58" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
    </g>
    <g class="action-node">
      <title>save(valid) → Either e Saved. May return Left on a database / IO failure.</title>
      <rect x="942" y="40" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
      <text class="action-label" x="1002" y="62" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">save</text>
      <g class="pin pin-in">
        <rect x="938" y="58" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        <text x="948" y="62" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">valid</text>
      </g>
      <g class="pin pin-out">
        <rect x="1058" y="58" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
      </g>
    </g>
    <g class="object-node">
      <title>Raw input — for example a request body or untrusted user data.</title>
      <rect x="36" y="43" width="110" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
      <text x="91" y="62" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">String</text>
    </g>
    <g class="object-node">
      <title>Left e — returned when any step failed. Caller must also inspect this.</title>
      <rect x="1369" y="101" width="110" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
      <text x="1424" y="120" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">Left e</text>
    </g>
    <g class="object-node">
      <title>Right Saved — the happy-path result, reached only when all three checks pass.</title>
      <rect x="1369" y="43" width="110" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
      <text x="1424" y="62" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">Right Saved</text>
    </g>
    <g class="decision-node">
      <title>Guard #1: pattern-matches Either e Parsed. The Right branch unwraps parsed for validate; Left joins errorRail.</title>
      <polygon points="433,48 456,62 433,76 410,62" fill="var(--fp-decision-fill)" stroke="var(--fp-decision-stroke)" stroke-width="1.5"/>
      <text x="433" y="62" text-anchor="middle" font-size="9" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-decision-label)">Left?</text>
    </g>
    <g class="decision-node">
      <title>Guard #2: same pattern repeated. Skipping this is a latent bug.</title>
      <polygon points="819,48 842,62 819,76 796,62" fill="var(--fp-decision-fill)" stroke="var(--fp-decision-stroke)" stroke-width="1.5"/>
      <text x="819" y="62" text-anchor="middle" font-size="9" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-decision-label)">Left?</text>
    </g>
    <g class="decision-node">
      <title>Guard #3: yet another check. Business logic is buried in guards.</title>
      <polygon points="1204,48 1227,62 1204,76 1181,62" fill="var(--fp-decision-fill)" stroke="var(--fp-decision-stroke)" stroke-width="1.5"/>
      <text x="1204" y="62" text-anchor="middle" font-size="9" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-decision-label)">Left?</text>
    </g>
    <g class="merge-node">
      <title>Any Left terminates the chain here — three separate failure paths converge.</title>
      <polygon points="1338,106 1352,120 1338,134 1324,120" fill="var(--fp-decision-fill)" stroke="var(--fp-decision-stroke)" stroke-width="1.5"/>
    </g>
  </g>
</svg>
