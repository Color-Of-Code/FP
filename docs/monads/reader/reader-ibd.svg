<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1457.4 237" width="1457.4" height="237" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">bind :: Reader r a ⟶ (a ⟶ Reader r b) ⟶ Reader r b — inside bind: the same environment r is supplied to both computations — also called: flatMap, &gt;&gt;=</title>
  <desc id="diagram-description">Functional programming diagram: bind :: Reader r a ⟶ (a ⟶ Reader r b) ⟶ Reader r b — inside bind: the same environment r is supplied to both computations — also called: flatMap, &gt;&gt;=</desc>
