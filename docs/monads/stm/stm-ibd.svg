<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1766.2 237" width="1766.2" height="237" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">bind :: STM a ⟶ (a ⟶ STM b) ⟶ STM b — inside bind: both actions run against one shared transaction log that commits or retries as a whole — also called: &gt;&gt;=</title>
  <desc id="diagram-description">Functional programming diagram: bind :: STM a ⟶ (a ⟶ STM b) ⟶ STM b — inside bind: both actions run against one shared transaction log that commits or retries as a whole — also called: &gt;&gt;=</desc>
  <style>:root {
  color-scheme: light;
  --fp-canvas: #ffffff;
  --fp-action-fill: #dafbe1;
  --fp-action-stroke: #1a7f37;
  --fp-obj-fill: #f6f8fa;
  --fp-obj-stroke: #57606a;
  --fp-hof-fill: #ddf4ff;
  --fp-hof-stroke: #0969da;
  --fp-pin-fill: #eaeef2;
  --fp-pin-stroke: #57606a;
  --fp-frame-fill: #ffffff;
  --fp-frame-stroke: #6e7781;
  --fp-frame-tab-fill: #eaeef2;
  --fp-init-fill: #24292f;
  --fp-final-stroke: #24292f;
  --fp-final-fill: #24292f;
  --fp-edge-stroke: #57606a;
  --fp-hof-edge: #0969da;
  --fp-label-fill: #24292f;
  --fp-secondary-text: #57606a;
  --fp-pin-label: #57606a;
  --fp-port-label: #57606a;
  --fp-decision-fill: #fff8c5;
  --fp-decision-stroke: #9a6700;
  --fp-decision-label: #633c01;
  --fp-note-fill: #fff8c5;
  --fp-note-fold-fill: #ffdf5d;
  --fp-note-stroke: #9a6700;
  --fp-note-label: #633c01;
  --fp-lane-fill: #f6f8fa;
  --fp-lane-stroke: #6e7781;
  --fp-lane-header: #eaeef2;
  --fp-error-text: #cf222e;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
  --fp-canvas: #0d1117;
  --fp-action-fill: #0f2d1f;
  --fp-action-stroke: #3fb950;
  --fp-obj-fill: #161b22;
  --fp-obj-stroke: #8b949e;
  --fp-hof-fill: #082f49;
  --fp-hof-stroke: #79c0ff;
  --fp-pin-fill: #30363d;
  --fp-pin-stroke: #8b949e;
  --fp-frame-fill: #0d1117;
  --fp-frame-stroke: #6e7681;
  --fp-frame-tab-fill: #21262d;
  --fp-init-fill: #e6edf3;
  --fp-final-stroke: #e6edf3;
  --fp-final-fill: #e6edf3;
  --fp-edge-stroke: #8b949e;
  --fp-hof-edge: #79c0ff;
  --fp-label-fill: #e6edf3;
  --fp-secondary-text: #9198a1;
  --fp-pin-label: #c9d1d9;
  --fp-port-label: #c9d1d9;
  --fp-decision-fill: #3d2c00;
  --fp-decision-stroke: #d29922;
  --fp-decision-label: #f0c674;
  --fp-note-fill: #3d2c00;
  --fp-note-fold-fill: #573a00;
  --fp-note-stroke: #d29922;
  --fp-note-label: #f0c674;
  --fp-lane-fill: #161b22;
  --fp-lane-stroke: #6e7681;
  --fp-lane-header: #21262d;
  --fp-error-text: #ff7b72;
  }
}</style>
  <defs>
    <marker id="arrowFilled" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 L2.5,5 Z" fill="var(--fp-edge-stroke)"/>
    </marker>
    <marker id="arrowOpen" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.25"/>
    </marker>
    <marker id="arrowHof" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 L2.5,5 Z" fill="var(--fp-hof-edge)"/>
    </marker>
  </defs>
  <text x="883.1" y="18" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="var(--fp-label-fill)">bind :: STM a ⟶ (a ⟶ STM b) ⟶ STM b</text>
  <text x="883.1" y="35" text-anchor="middle" font-size="11" font-weight="normal" font-family="sans-serif" fill="var(--fp-secondary-text)">inside bind: both actions run against one shared transaction log that commits or retries as a whole</text>
  <text x="883.1" y="51" text-anchor="middle" font-size="11" font-weight="normal" font-family="sans-serif" fill="var(--fp-secondary-text)">also called: &gt;&gt;=</text>
  <g transform="translate(0,60) scale(1)">
    <g transform="translate(82,0)">
      <rect x="0" y="0" width="1619.2" height="177" fill="var(--fp-frame-fill)" stroke="var(--fp-frame-stroke)" stroke-width="1.5"/>
      <g class="diagram-frame-tab tab-block">
        <path d="M0,0 L90.4,0 L90.4,12 L80.4,22 L0,22 Z" fill="var(--fp-frame-tab-fill)" stroke="var(--fp-frame-stroke)" stroke-width="1"/>
        <text x="45.2" y="12" text-anchor="middle" font-size="10" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">«block» bind</text>
      </g>
      <g class="edge">
        <path d="M4.0,69.0 L319.2,69.0 Q325.2,69.0 325.2,75.0 L325.2,81.0 L325.2,81.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="164.60000000000002" y="63" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">wrapped</text>
      </g>
      <g class="edge">
        <path d="M241.2,106.0 L247.7,106.0 Q251.2,106.0 251.2,102.5 L251.2,102.5 Q251.2,99.0 254.7,99.0 L323.2,99.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="293.20000000000005" y="93" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">shared log</text>
      </g>
      <g class="edge">
        <path d="M473.2,90.0 L545.2,90.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="517.2" y="84" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">result</text>
      </g>
      <g class="edge">
        <path d="M4.0,34.0 L541.2,34.0 Q547.2,34.0 547.2,40.0 L547.2,72.0 L547.2,72.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="275.6" y="28" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">user code</text>
      </g>
      <g class="edge">
        <path d="M689.2,81.0 L772.2,81.0 Q778.2,81.0 778.2,87.0 L778.2,99.0 L778.2,99.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="735.7" y="75" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">next action</text>
      </g>
      <g class="edge">
        <path d="M241.2,106.0 L246.2,106.0 Q251.2,106.0 251.2,111.0 L251.2,121.0 Q251.2,127.0 257.2,127.0 L773.2,127.0 Q778.2,127.0 778.2,122.0 L778.2,117.0 L778.2,117.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="514.7" y="121" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">same log</text>
      </g>
      <g class="edge">
        <path d="M956.2,108.0 L1064.2,108.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="1018.2" y="102" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">tentative result</text>
      </g>
      <g class="edge">
        <path d="M1268.2,108.0 L1341.2,108.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="1312.7" y="102" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">committed</text>
      </g>
      <g class="edge">
        <path d="M1521.2,108.0 L1603.2,108.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      </g>
      <g class="object-node">
        <title>The transaction log: TVar reads and tentative writes are recorded here, not applied. One log is shared by both steps.</title>
        <rect x="70.00000000000001" y="87" width="171.20000000000002" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
        <text x="155.60000000000002" y="106" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">log : transaction log</text>
      </g>
      <g class="action-node">
        <title>Run the first action against the log, producing a.</title>
        <rect x="343.20000000000005" y="68" width="126" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="406.20000000000005" y="90" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">run_ma : run ma</text>
        <g class="pin pin-in">
          <rect x="339.20000000000005" y="78.66666666666667" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="349.20000000000005" y="82.66666666666667" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">m</text>
        </g>
        <g class="pin pin-in">
          <rect x="339.20000000000005" y="93.33333333333333" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="349.20000000000005" y="97.33333333333333" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">log</text>
        </g>
        <g class="pin pin-out">
          <rect x="465.20000000000005" y="86" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="action-node">
        <title>Apply f to the result: yields the next atomic action, not yet run.</title>
        <rect x="565.2" y="59" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="625.2" y="81" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">call : f a</text>
        <g class="pin pin-in">
          <rect x="561.2" y="69.66666666666667" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="571.2" y="73.66666666666667" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">f</text>
        </g>
        <g class="pin pin-in">
          <rect x="561.2" y="84.33333333333333" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="571.2" y="88.33333333333333" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">a</text>
        </g>
        <g class="pin pin-out">
          <rect x="681.2" y="77" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="action-node">
        <title>The STM-specific join: run the action f built against the SAME log, so both steps form one atomic unit.</title>
        <rect x="796.2" y="86" width="156" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="874.2" y="108" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">run_next : run (f a)</text>
        <g class="pin pin-in">
          <rect x="792.2" y="96.66666666666667" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="802.2" y="100.66666666666667" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">m</text>
        </g>
        <g class="pin pin-in">
          <rect x="792.2" y="111.33333333333333" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="802.2" y="115.33333333333333" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">log</text>
        </g>
        <g class="pin pin-out">
          <rect x="948.2" y="104" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="action-node">
        <title>atomically: validate the log against the current TVar values. If nothing conflicts, publish all writes at once; otherwise (or on retry) discard the log and start over.</title>
        <rect x="1084.2" y="86" width="180" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="1174.2" y="108" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">commit : commit or retry</text>
        <g class="pin pin-in">
          <rect x="1080.2" y="104" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
        <g class="pin pin-out">
          <rect x="1260.2" y="104" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="action-node">
        <title>Package the whole script as one atomic action, to be run by atomically.</title>
        <rect x="1361.2" y="86" width="156" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="1439.2" y="108" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">wrap : atomic action</text>
        <g class="pin pin-in">
          <rect x="1357.2" y="104" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
        <g class="pin pin-out">
          <rect x="1513.2" y="104" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="port port-left">
        <title>STM a — an atomic action on TVars (transactional variables). Not yet committed.</title>
        <rect x="-4" y="65" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1.5"/>
        <text x="-7" y="63" font-size="9" font-family="sans-serif" text-anchor="end" fill="var(--fp-port-label)">ma : STM a</text>
      </g>
      <g class="port port-left">
        <title>f : a ⟶ STM b — user code; given result a of the first action, constructs the next atomic step</title>
        <rect x="-4" y="30" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1.5"/>
        <text x="-7" y="28" font-size="9" font-family="sans-serif" text-anchor="end" fill="var(--fp-port-label)">f : a ⟶ STM b</text>
      </g>
      <g class="port port-right">
        <title>STM b — the composed atomic action. Runs inside atomically :: STM a -&gt; IO a.</title>
        <rect x="1615.2" y="104" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1.5"/>
        <text x="1626.2" y="102" font-size="9" font-family="sans-serif" text-anchor="start" fill="var(--fp-port-label)">mb : STM b</text>
      </g>
    </g>
  </g>
</svg>
