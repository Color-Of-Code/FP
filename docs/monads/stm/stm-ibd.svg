<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 559.2 194" width="559.2" height="194" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">bind :: STM a ⟶ (a ⟶ STM b) ⟶ STM b — also called: &gt;&gt;=</title>
  <desc id="diagram-description">Functional programming diagram: bind :: STM a ⟶ (a ⟶ STM b) ⟶ STM b — also called: &gt;&gt;=</desc>
  <style>:root {
  color-scheme: light;
  --fp-canvas: #ffffff;
  --fp-action-fill: #dafbe1;
