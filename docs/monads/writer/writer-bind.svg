<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 251" width="1062" height="251" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Writer bind: extract a+w1, apply f→(b,w2), combine logs w1&lt;&gt;w2 — also called: flatMap, &gt;&gt;=</title>
  <desc id="diagram-description">Functional programming diagram: Writer bind: extract a+w1, apply f→(b,w2), combine logs w1&lt;&gt;w2 — also called: flatMap, &gt;&gt;=</desc>
