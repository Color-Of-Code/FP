    </g>
    <g class="edge">
      <path d="M590.0,61.0 L608.0,61.0 Q614.0,61.0 614.0,67.0 L614.0,115.0 L614.0,115.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
