    </g>
    <g class="edge">
      <path d="M581.0,142.0 L738.0,142.0 Q744.0,142.0 744.0,136.0 L744.0,131.0 Q744.0,127.0 748.0,127.0 L752.0,127.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
    </g>
    <g class="edge">
