    </g>
    <g class="object-node">
      <title>(a, w1) — a result value a paired with a log fragment w1</title>
      <rect x="91.60000000000002" y="82" width="135.2" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
      <text x="159.20000000000002" y="101" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">ma_val : (a, w1)</text>
    </g>
    <g class="object-node hof">
      <title>(a ⟶ (b, w2)) — given a, produces result b alongside a new log fragment w2</title>
      <rect x="70" y="30" width="156.8" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
      <text x="148.4" y="42" text-anchor="middle" font-size="9" font-style="italic" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-hof-stroke)">«function»</text>
      <text x="148.4" y="56" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">f_val : a ⟶ (b, w2)</text>
    </g>
    <g class="action-node">
      <title>extract a from (a, w1)\napply f(a) to get (b, w2)\nreturn (b, w1 &lt;&gt; w2)  ← logs combined with monoid append</title>
      <rect x="246.8" y="34" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
      <text class="action-label" x="306.8" y="56" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">bind : WriterBindOp</text>
    </g>
    <g class="object-node">
      <title>(b, w1&lt;&gt;w2) — result b with the complete log: w1 from the first step appended with w2 from f</title>
      <rect x="382.8" y="37" width="164" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
      <text x="464.8" y="56" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">mb_val : (b, w1&lt;&gt;w2)</text>
    </g>
  </g>
