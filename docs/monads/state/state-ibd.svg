    </g>
    <g class="object-node">
      <title>State s a — a computation: given state s returns (a, s')</title>
      <rect x="91.60000000000004" y="134" width="149.6" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
      <text x="166.40000000000003" y="153" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">sa_val : State s a</text>
    </g>
    <g class="object-node hof">
      <title>(a ⟶ State s b) — continuation: given result a, produces a new state computation</title>
      <rect x="70.00000000000001" y="82" width="171.20000000000002" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
      <text x="155.60000000000002" y="94" text-anchor="middle" font-size="9" font-style="italic" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-hof-stroke)">«function»</text>
      <text x="155.60000000000002" y="108" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">f_val : a ⟶ State s b</text>
    </g>
    <g class="object-node">
      <title>s — current state entering bind. The value side and the state side are both threaded.</title>
      <rect x="131.20000000000002" y="30" width="110" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
      <text x="186.20000000000002" y="49" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">s_in : s</text>
    </g>
    <g class="action-node">
      <title>bind sa f = \\s -&gt;\n  let (a, s')  = sa(s)    -- run sa: get result a and new state s'\n      (b, s'') = f(a)(s') -- run f(a) with s': get b and final state s''\n  in  (b, s'')</title>
      <rect x="261.20000000000005" y="79" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
      <text class="action-label" x="321.20000000000005" y="101" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">bind : StateBindOp</text>
    </g>
    <g class="object-node">
      <title>State s b — the composed computation; when run it produces (b, s'')</title>
      <rect x="401.20000000000005" y="75" width="149.6" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
      <text x="476.00000000000006" y="94" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">sb_val : State s b</text>
    </g>
    <g class="object-node">
      <title>s — the transformed state after both sa and f(a) have run. Different from s_in.</title>
      <rect x="401.20000000000005" y="127" width="110" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
      <text x="456.20000000000005" y="146" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">s_out : s</text>
    </g>
  </g>
