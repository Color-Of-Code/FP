<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254.6 230" width="1254.6" height="230" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">bind :: State s a ⟶ (a ⟶ State s b) ⟶ State s b — inside bind: the state s' left by the first step is threaded into the second — also called: flatMap, &gt;&gt;=</title>
  <desc id="diagram-description">Functional programming diagram: bind :: State s a ⟶ (a ⟶ State s b) ⟶ State s b — inside bind: the state s' left by the first step is threaded into the second — also called: flatMap, &gt;&gt;=</desc>
