  <text x="769.6" y="18" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="var(--fp-label-fill)">bind :: State s a ⟶ (a ⟶ State s b) ⟶ State s b</text>
  <text x="769.6" y="35" text-anchor="middle" font-size="11" font-weight="normal" font-family="sans-serif" fill="var(--fp-secondary-text)">inside bind: the state s' left by the first step is threaded into the second</text>
