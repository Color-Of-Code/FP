  <defs>
    <marker id="arrowFilled" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 L2.5,5 Z" fill="var(--fp-edge-stroke)"/>
    </marker>
    <marker id="arrowOpen" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.25"/>
    </marker>
    <marker id="arrowHof" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 L2.5,5 Z" fill="var(--fp-hof-edge)"/>
    </marker>
  </defs>
  <text x="627.3" y="18" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="var(--fp-label-fill)">bind :: State s a ⟶ (a ⟶ State s b) ⟶ State s b</text>
  <text x="627.3" y="35" text-anchor="middle" font-size="11" font-weight="normal" font-family="sans-serif" fill="var(--fp-secondary-text)">inside bind: the state s' left by the first step is threaded into the second</text>
  <text x="627.3" y="51" text-anchor="middle" font-size="11" font-weight="normal" font-family="sans-serif" fill="var(--fp-secondary-text)">also called: flatMap, &gt;&gt;=</text>
  <g transform="translate(0,60) scale(1)">
    <g transform="translate(38,0)">
      <rect x="0" y="0" width="1145.6" height="170" fill="var(--fp-frame-fill)" stroke="var(--fp-frame-stroke)" stroke-width="1.5"/>
      <g class="diagram-frame-tab tab-block">
        <path d="M0,0 L96.60000000000001,0 L96.60000000000001,12 L86.60000000000001,22 L0,22 Z" fill="var(--fp-frame-tab-fill)" stroke="var(--fp-frame-stroke)" stroke-width="1"/>
        <text x="48.300000000000004" y="12" text-anchor="middle" font-size="10" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">«block» bound</text>
      </g>
      <g class="edge hof-edge">
        <path d="M270.0,83.0 L334.0,83.0 Q340.0,83.0 340.0,89.0 L340.0,89.0 Q340.0,95.0 346.0,95.0 L380.8,95.0" fill="none" stroke="var(--fp-hof-edge)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowHof)"/>
        <text x="305" y="77" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">captured</text>
      </g>
      <g class="edge">
        <path d="M4.0,120.0 L336.5,120.0 Q340.0,120.0 340.0,116.5 L340.0,116.5 Q340.0,113.0 343.5,113.0 L380.8,113.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="172" y="114" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">state</text>
      </g>
      <g class="edge">
        <path d="M524.8,95.0 L576.6,95.0 Q581.6,95.0 581.6,90.0 L581.6,90.0 Q581.6,85.0 586.6,85.0 L643.6,85.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="618.6" y="79" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">result</text>
      </g>
      <g class="edge hof-edge">
        <path d="M571.6,49.0 L639.6,49.0 Q645.6,49.0 645.6,55.0 L645.6,67.0 L645.6,67.0" fill="none" stroke="var(--fp-hof-edge)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowHof)"/>
        <text x="608.6" y="43" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">captured</text>
      </g>
      <g class="edge">
        <path d="M787.6,76.0 L867.1,76.0 Q871.6,76.0 871.6,80.5 L871.6,85.0 L871.6,85.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="831.6" y="70" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">next State</text>
      </g>
      <g class="edge">
        <path d="M524.8,113.0 L866.6,113.0 Q871.6,113.0 871.6,108.0 L871.6,103.0 L871.6,103.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="700.2" y="107" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">state threaded</text>
      </g>
      <g class="edge">
        <path d="M1043.6,85.0 L1129.6,85.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      </g>
      <g class="edge">
        <path d="M1043.6,103.0 L1055.6,103.0 Q1057.6,103.0 1057.6,105.0 L1057.6,105.0 Q1057.6,107.0 1059.6,107.0 L1129.6,107.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
      </g>
      <g class="object-node hof">
        <title>ma : State s a — a computation: given state s returns (a, s'); fixed when bind was applied</title>
        <rect x="70" y="64" width="200" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
        <text x="170" y="76" text-anchor="middle" font-size="9" font-style="italic" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-hof-stroke)">«function»</text>
        <text x="170" y="90" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">ma : State s a — captured</text>
      </g>
      <g class="object-node hof">
        <title>f : a ⟶ State s b — user code; given result a, produces a new state computation; fixed when bind was applied</title>
        <rect x="350" y="30" width="221.6" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
        <text x="460.8" y="42" text-anchor="middle" font-size="9" font-style="italic" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-hof-stroke)">«function»</text>
        <text x="460.8" y="56" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">f : a ⟶ State s b — captured</text>
      </g>
      <g class="action-node">
        <title>Run the first computation: ma s = (a, s').</title>
        <rect x="400.8" y="82" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="460.8" y="104" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">run_ma : ma s</text>
        <g class="pin pin-in">
          <rect x="396.8" y="92.66666666666667" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="406.8" y="96.66666666666667" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">m</text>
        </g>
        <g class="pin pin-in">
          <rect x="396.8" y="107.33333333333333" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="406.8" y="111.33333333333333" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">s</text>
        </g>
        <g class="pin pin-out">
          <rect x="516.8" y="92.66666666666667" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="514.8" y="96.66666666666667" text-anchor="end" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">a</text>
        </g>
        <g class="pin pin-out">
          <rect x="516.8" y="107.33333333333333" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="514.8" y="111.33333333333333" text-anchor="end" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">s1</text>
        </g>
      </g>
      <g class="action-node">
        <title>Apply f to the result: yields the next State computation, not yet run.</title>
        <rect x="663.6" y="54" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="723.6" y="76" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">call : f a</text>
        <g class="pin pin-in">
          <rect x="659.6" y="64.66666666666667" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="669.6" y="68.66666666666667" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">f</text>
        </g>
        <g class="pin pin-in">
          <rect x="659.6" y="79.33333333333333" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="669.6" y="83.33333333333333" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">a</text>
        </g>
        <g class="pin pin-out">
          <rect x="779.6" y="72" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="action-node">
        <title>The State-specific join: run the computation f built with the state s' that the first step left behind — (f a) s' = (b, s'').</title>
        <rect x="889.6" y="72" width="150" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="964.6" y="94" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">run_next : (f a) s'</text>
        <g class="pin pin-in">
          <rect x="885.6" y="82.66666666666667" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="895.6" y="86.66666666666667" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">m</text>
        </g>
        <g class="pin pin-in">
          <rect x="885.6" y="97.33333333333333" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="895.6" y="101.33333333333333" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">s</text>
        </g>
        <g class="pin pin-out">
          <rect x="1035.6" y="82.66666666666667" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="1033.6" y="86.66666666666667" text-anchor="end" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">b</text>
        </g>
        <g class="pin pin-out">
          <rect x="1035.6" y="97.33333333333333" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="1033.6" y="101.33333333333333" text-anchor="end" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">s2</text>
        </g>
      </g>
      <g class="port port-left">
        <title>s — the state, supplied each time the State is run</title>
        <rect x="-4" y="116" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1.5"/>
        <text x="-7" y="114" font-size="9" font-family="sans-serif" text-anchor="end" fill="var(--fp-port-label)">s : s</text>
      </g>
      <g class="port port-right">
        <title>b — the result of running the composed computation</title>
        <rect x="1141.6" y="81" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1.5"/>
        <text x="1152.6" y="79" font-size="9" font-family="sans-serif" text-anchor="start" fill="var(--fp-port-label)">b : b</text>
      </g>
      <g class="port port-right">
        <title>s'' — the final state, after both steps have run</title>
        <rect x="1141.6" y="103" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1.5"/>
        <text x="1152.6" y="101" font-size="9" font-family="sans-serif" text-anchor="start" fill="var(--fp-port-label)">s_out : s''</text>
      </g>
    </g>
  </g>
</svg>
