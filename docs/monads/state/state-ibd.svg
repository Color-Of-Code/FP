  --fp-final-stroke: #e6edf3;
  --fp-final-fill: #e6edf3;
  --fp-edge-stroke: #8b949e;
  --fp-hof-edge: #79c0ff;
  --fp-label-fill: #e6edf3;
  --fp-secondary-text: #9198a1;
  --fp-pin-label: #c9d1d9;
