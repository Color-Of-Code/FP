        <text x="663.2" y="93" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">state threaded</text>
      </g>
      <g class="edge">
        <path d="M980.2,71.0 L1071.2,71.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="1033.7" y="65" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">result</text>
      </g>
      <g class="edge">
        <path d="M980.2,89.0 L988.2,89.0 Q994.2,89.0 994.2,95.0 L994.2,95.0 Q994.2,101.0 1000.2,101.0 L1067.2,101.0 Q1073.2,101.0 1073.2,95.0 L1073.2,89.0 L1073.2,89.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="1033.7" y="95" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">final state</text>
