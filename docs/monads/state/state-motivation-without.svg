<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1209 203" width="1209" height="203" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Without bind: state threaded as explicit s0/s1/s2/s3 variables</title>
  <desc id="diagram-description">Functional programming diagram: Without bind: state threaded as explicit s0/s1/s2/s3 variables</desc>
  <style>:root {
  color-scheme: light;
  --fp-canvas: #ffffff;
  --fp-action-fill: #dafbe1;
  --fp-action-stroke: #1a7f37;
  --fp-obj-fill: #f6f8fa;
  --fp-obj-stroke: #57606a;
  --fp-hof-fill: #ddf4ff;
  --fp-hof-stroke: #0969da;
  --fp-pin-fill: #eaeef2;
