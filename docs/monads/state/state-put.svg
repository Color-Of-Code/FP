<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 565 146" width="565" height="146" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">put :: s ⟶ State s ()   (overwrite the state with s'; result is unit) — primitive</title>
  <desc id="diagram-description">Functional programming diagram: put :: s ⟶ State s ()   (overwrite the state with s'; result is unit) — primitive</desc>
  <style>:root {
  color-scheme: light;
  --fp-canvas: #ffffff;
  --fp-action-fill: #dafbe1;
  --fp-action-stroke: #1a7f37;
  --fp-obj-fill: #f6f8fa;
