    <g class="edge">
      <path d="M374.0,101.0 L378.0,101.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
    </g>
    <g class="object-node">
      <title>Parser a = String ⟶ Maybe (a, String) — run on input; succeeds with (a, rest) or fails with Nothing</title>
      <rect x="91.60000000000001" y="134" width="142.4" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
      <text x="162.8" y="153" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">pa_val : Parser a</text>
    </g>
    <g class="object-node hof">
      <title>(a ⟶ Parser b) — given parsed value a, constructs the next parser (runs on the remaining input)</title>
      <rect x="70" y="82" width="164" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
      <text x="152" y="94" text-anchor="middle" font-size="9" font-style="italic" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-hof-stroke)">«function»</text>
      <text x="152" y="108" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">f_val : a ⟶ Parser b</text>
    </g>
    <g class="object-node">
      <title>String — the unconsumed remainder after pa_val runs. bind threads it into f(a). Nothing short-circuits (like Maybe).</title>
      <rect x="120.39999999999998" y="30" width="113.60000000000001" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
      <text x="177.2" y="49" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">rest : String</text>
    </g>
    <g class="action-node">
      <title>bind p f = \\input -&gt;\n  case p(input) of\n    Nothing       -&gt; Nothing        -- propagate failure\n    Just (a, rest) -&gt; f a rest      -- thread rest into next parser</title>
      <rect x="254" y="79" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
      <text class="action-label" x="314" y="101" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">bind : ParserBindOp</text>
    </g>
    <g class="object-node">
      <title>Parser b — the composed parser; on success returns (b, rest2) where rest2 is what f(a) didn't consume</title>
      <rect x="390" y="82" width="142.4" height="38" fill="var(--fp-obj-fill)" stroke="var(--fp-obj-stroke)" stroke-width="1.5"/>
      <text x="461.2" y="101" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">pb_val : Parser b</text>
    </g>
  </g>
