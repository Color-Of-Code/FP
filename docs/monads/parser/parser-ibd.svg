      </g>
      <g class="object-node hof">
        <title>ma : Parser a = String ⟶ Maybe (a, String) — succeeds with (a, rest) or fails with Nothing; fixed when bind was applied</title>
        <rect x="70" y="79" width="192.8" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
        <text x="166.4" y="91" text-anchor="middle" font-size="9" font-style="italic" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-hof-stroke)">«function»</text>
        <text x="166.4" y="105" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">ma : Parser a — captured</text>
      </g>
      <g class="object-node hof">
        <title>f : a ⟶ Parser b — user code; given parsed value a, constructs the next parser; fixed when bind was applied</title>
        <rect x="561.8" y="30" width="214.4" height="38" fill="var(--fp-hof-fill)" stroke="var(--fp-hof-stroke)" stroke-width="1.5"/>
        <text x="669" y="42" text-anchor="middle" font-size="9" font-style="italic" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-hof-stroke)">«function»</text>
        <text x="669" y="56" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">f : a ⟶ Parser b — captured</text>
      </g>
      <g class="action-node">
        <title>Run the first parser on the text: ma text.</title>
        <rect x="350.8" y="85" width="132" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="416.8" y="107" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">run_ma : ma text</text>
        <g class="pin pin-in">
          <rect x="346.8" y="95.66666666666667" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="356.8" y="99.66666666666667" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">p</text>
        </g>
        <g class="pin pin-in">
          <rect x="346.8" y="110.33333333333333" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="356.8" y="114.33333333333333" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">s</text>
        </g>
        <g class="pin pin-out">
          <rect x="478.8" y="103" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="action-node">
        <title>Pattern match on the outcome.\nJust (a, rest) → value and unconsumed rest leave separately\nNothing        → the parse failed</title>
        <rect x="624.1" y="85" width="126" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="687.1" y="107" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">match : case of</text>
        <g class="pin pin-in">
          <rect x="620.1" y="103" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
        <g class="pin pin-out">
          <rect x="746.1" y="92" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="744.1" y="96" text-anchor="end" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">a</text>
        </g>
        <g class="pin pin-out">
          <rect x="746.1" y="103" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="744.1" y="107" text-anchor="end" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">rest</text>
        </g>
        <g class="pin pin-out">
          <rect x="746.1" y="114" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="744.1" y="118" text-anchor="end" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">nothing</text>
        </g>
      </g>
      <g class="action-node">
        <title>Apply f to the parsed value: yields the next parser, not yet run.</title>
        <rect x="888.2" y="48" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="948.2" y="70" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">call : f a</text>
        <g class="pin pin-in">
          <rect x="884.2" y="58.666666666666664" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="894.2" y="62.666666666666664" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">f</text>
        </g>
        <g class="pin pin-in">
          <rect x="884.2" y="73.33333333333333" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="894.2" y="77.33333333333333" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">a</text>
        </g>
        <g class="pin pin-out">
          <rect x="1004.2" y="66" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="action-node">
        <title>Run the next parser on the remainder: (f a) rest. This is the threading step of the join.</title>
        <rect x="1119.2" y="57" width="162" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="1200.2" y="79" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">run_next : (f a) rest</text>
        <g class="pin pin-in">
          <rect x="1115.2" y="67.66666666666667" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="1125.2" y="71.66666666666667" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">p</text>
        </g>
        <g class="pin pin-in">
          <rect x="1115.2" y="82.33333333333333" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
          <text x="1125.2" y="86.33333333333333" text-anchor="start" dominant-baseline="middle" font-size="8" font-family="sans-serif" fill="var(--fp-pin-label)">s</text>
