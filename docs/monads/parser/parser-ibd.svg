    </g>
    <g class="edge">
      <path d="M234.0,153.0 L239.0,153.0 Q244.0,153.0 244.0,148.0 L244.0,112.0 L244.0,112.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
