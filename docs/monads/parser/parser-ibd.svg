        </g>
      </g>
      <g class="action-node">
        <title>Short-circuit: failure is propagated, f is skipped.</title>
        <rect x="1140.2" y="115" width="120" height="44" rx="12" fill="var(--fp-action-fill)" stroke="var(--fp-action-stroke)" stroke-width="1.5"/>
        <text class="action-label" x="1200.2" y="137" text-anchor="middle" font-size="11" font-family="sans-serif" dominant-baseline="middle" fill="var(--fp-label-fill)">fail : Nothing</text>
        <g class="pin pin-in">
          <rect x="1136.2" y="133" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
        <g class="pin pin-out">
          <rect x="1256.2" y="133" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1"/>
        </g>
      </g>
      <g class="port port-left">
        <title>The text to parse, supplied each time the parser is run</title>
        <rect x="-4" y="131" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1.5"/>
        <text x="-7" y="129" font-size="9" font-family="sans-serif" text-anchor="end" fill="var(--fp-port-label)">text : String</text>
      </g>
      <g class="port port-right">
        <title>Just (b, rest2) where rest2 is what f(a) didn't consume, or Nothing if either parser failed</title>
        <rect x="1383.2" y="75" width="8" height="8" fill="var(--fp-pin-fill)" stroke="var(--fp-pin-stroke)" stroke-width="1.5"/>
        <text x="1394.2" y="73" font-size="9" font-family="sans-serif" text-anchor="start" fill="var(--fp-port-label)">result : Maybe (b, String)</text>
      </g>
