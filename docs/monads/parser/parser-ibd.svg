      <g class="edge">
        <path d="M754.1,120.0 L780.2,120.0 Q786.2,120.0 786.2,126.0 L786.2,131.0 Q786.2,137.0 792.2,137.0 L1120.2,137.0" fill="none" stroke="var(--fp-edge-stroke)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowFilled)"/>
        <text x="959.2" y="131" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="sans-serif" fill="var(--fp-label-fill)">f skipped</text>
