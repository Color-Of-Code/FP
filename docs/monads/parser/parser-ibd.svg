  <text x="980.3" y="18" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="var(--fp-label-fill)">bind :: Parser a ⟶ (a ⟶ Parser b) ⟶ Parser b</text>
  <text x="980.3" y="35" text-anchor="middle" font-size="11" font-weight="normal" font-family="sans-serif" fill="var(--fp-secondary-text)">inside bind: the unconsumed rest is threaded into the next parser; failure skips it</text>
  <text x="980.3" y="51" text-anchor="middle" font-size="11" font-weight="normal" font-family="sans-serif" fill="var(--fp-secondary-text)">also called: flatMap, Bind, &gt;&gt;=</text>
