  <text x="810.6" y="18" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="var(--fp-label-fill)">bind :: Parser a ⟶ (a ⟶ Parser b) ⟶ Parser b</text>
  <text x="810.6" y="35" text-anchor="middle" font-size="11" font-weight="normal" font-family="sans-serif" fill="var(--fp-secondary-text)">inside bind: the unconsumed rest is threaded into the next parser; failure skips it</text>
