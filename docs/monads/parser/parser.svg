<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 695.8 177" width="695.8" height="177" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">A Parser a consumes input and returns a value with the unconsumed suffix</title>
  <desc id="diagram-description">Functional programming diagram: A Parser a consumes input and returns a value with the unconsumed suffix</desc>
  <style>:root {
